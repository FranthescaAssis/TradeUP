services:
  - type: web
    name: tradeup
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradeup-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: tradeup-db
    databaseName: tradeup
    plan: free
    region: ohio
    ipAllowList: []
